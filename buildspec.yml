version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt

  pre_build:
    commands:
      - python -m py_compile app.py

  build:
    commands:
      - docker build -t iris-ml-api:latest .

  post_build:
    commands:
      - echo "ML Docker image built successfully!"
